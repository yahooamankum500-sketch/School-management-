{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Staff Attendance</h2>
        <a href="/staff-attendance/leaves" style="background:#f59e0b; color:white; padding:8px 15px; text-decoration:none; border-radius:5px;">📝 Leave Requests</a>
    </div>

    <form method="GET" style="margin-bottom:20px; display:flex; gap:10px;">
        <input type="date" name="date" value="{{ date_str }}" required style="padding:8px; border:1px solid #ccc; border-radius:5px;">
        <button type="submit" style="padding:8px 15px; background:#3b82f6; color:white; border:none; border-radius:5px; cursor:pointer;">Load Date</button>
    </form>

    {% if staff %}
    <form method="POST">
        <table style="width:100%; border-collapse:collapse;">
            <tr style="background:#f8fafc;">
                <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Staff Name</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Role</th>
                <th style="padding:10px; text-align:center; border-bottom:1px solid #ddd;">Status</th>
            </tr>
            {% for s in staff %}
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eee;"><strong>{{ s.name }}</strong></td>
                <td style="padding:10px; border-bottom:1px solid #eee;">{{ s.role }}</td>
                <td style="padding:10px; border-bottom:1px solid #eee; text-align:center;">
                    <select name="mark_{{ s.id }}" style="padding:5px; border-radius:5px; 
                        background:{% if s.status == 'present' %}#d1fae5{% elif s.status == 'absent' %}#fee2e2{% else %}#fff{% endif %};">
                        <option value="present" {% if s.status == 'present' %}selected{% endif %}>Present (P)</option>
                        <option value="absent" {% if s.status == 'absent' %}selected{% endif %}>Absent (A)</option>
                        <option value="leave" {% if s.status == 'leave' %}selected{% endif %}>Leave (L)</option>
                    </select>
                </td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit" style="margin-top:20px; background:#10b981; color:white; padding:12px; width:100%; border:none; border-radius:5px; cursor:pointer; font-weight:bold; font-size:16px;">Save Staff Attendance</button>
    </form>
    {% else %}
    <p style="text-align:center; color:#666;">Koi staff member nahi mila.</p>
    {% endif %}
</div>
{% endblock %}
