{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px;">
    <h2>Hostel Management</h2>
    
    <!-- Add Hostel Form -->
    <form method="POST" action="/hostel/add" style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" name="name" placeholder="Hostel Name (e.g. Boys Hostel A)" required style="flex:1; min-width:200px; padding:8px; border:1px solid #ccc; border-radius:5px;">
        <input type="text" name="warden_name" placeholder="Warden Name" style="padding:8px; border:1px solid #ccc; border-radius:5px;">
        <input type="text" name="warden_phone" placeholder="Warden Phone" style="padding:8px; border:1px solid #ccc; border-radius:5px;">
        <button type="submit" style="background:#3b82f6; color:white; padding:8px 15px; border:none; border-radius:5px; cursor:pointer;">+ Add Hostel</button>
    </form>

    <!-- Hostels List -->
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:15px;">
        {% for h in hostels %}
        <div style="border:1px solid #eee; border-radius:8px; padding:15px;">
            <h3 style="margin-top:0; color:#1e293b;">🏠 {{ h.name }}</h3>
            <div style="font-size:14px; color:#475569; margin-bottom:15px;">
                <div>👤 Warden: {{ h.warden_name or '-' }}</div>
                <div>📞 Phone: {{ h.warden_phone or '-' }}</div>
            </div>
            <a href="/hostel/{{ h.id }}" style="display:inline-block; background:#10b981; color:white; padding:8px 15px; text-decoration:none; border-radius:5px; font-size:14px;">Manage Rooms & Inmates →</a>
        </div>
        {% else %}
        <p style="color:#666;">Koi hostel nahi hai. Upar se add karein.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
