{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px; max-width:600px; margin:auto;">
    <h2>Medical Records</h2>
    <p style="color:#666; font-size:14px; margin-bottom:20px;">Record dekhne ya update karne ke liye student select karein.</p>
    
    <table style="width:100%; border-collapse:collapse;">
        <tr style="background:#f8fafc;">
            <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Name</th>
            <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Class</th>
            <th style="padding:10px; text-align:right; border-bottom:1px solid #ddd;">Action</th>
        </tr>
        {% for s in students %}
        <tr>
            <td style="padding:10px; border-bottom:1px solid #eee;"><strong>{{ s.name }}</strong></td>
            <td style="padding:10px; border-bottom:1px solid #eee;">{{ s.class_name }} {{ s.section or '' }}</td>
            <td style="padding:10px; border-bottom:1px solid #eee; text-align:right;">
                <a href="/medical/{{ s.id }}" style="color:#3b82f6; text-decoration:none; font-weight:bold;">View/Edit →</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="3" style="padding:20px; text-align:center; color:#666;">Koi student nahi hai.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
