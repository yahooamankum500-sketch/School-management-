{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px; max-width:600px; margin:auto;">
    <h2>Post New Homework</h2>
    <form method="POST">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;">
            <div>
                <label>Class *</label>
                <select name="class_name" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
                    <option value="">Select Class</option>
                    {% for c in classes %}
                    <option value="{{ c }}">Class {{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Section (Optional)</label>
                <input type="text" name="section" placeholder="e.g. A" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
        </div>

        <div style="margin-bottom:15px;">
            <label>Subject *</label>
            <input type="text" name="subject" required placeholder="e.g. Mathematics" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
        </div>

        <div style="margin-bottom:15px;">
            <label>Title *</label>
            <input type="text" name="title" required placeholder="e.g. Chapter 5 Exercise" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
        </div>

        <div style="margin-bottom:15px;">
            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Homework details..." style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;"></textarea>
        </div>

        <div style="margin-bottom:20px;">
            <label>Due Date</label>
            <input type="date" name="due_date" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
        </div>

        <button type="submit" style="background:#10b981; color:white; padding:12px 20px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; width:100%;">
            Post Homework
        </button>
        <div style="text-align:center; margin-top:10px;">
            <a href="/homework/" style="color:#666; text-decoration:none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
