{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;">
    <h2>Create Online Exam</h2>
    <form method="POST">
        <div style="margin-bottom:15px;">
            <label>Exam Title *</label>
            <input type="text" name="title" required placeholder="e.g. Science Quiz 1" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
        </div>
        
        <div style="margin-bottom:15px;">
            <label>Class *</label>
            <select name="class_name" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                <option value="">Select Class</option>
                {% for c in classes %}
                <option value="{{ c }}">Class {{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom:20px;">
            <label>Duration (Minutes) *</label>
            <input type="number" name="duration_minutes" value="30" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
        </div>
        
        <button type="submit" style="background:#3b82f6; color:white; padding:12px; width:100%; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Create & Add Questions</button>
        <div style="text-align:center; margin-top:10px;">
            <a href="/online-exams/" style="color:#666; text-decoration:none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
