{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px; max-width:600px; margin:auto;">
    <h2>{% if student %}Edit Student{% else %}Add New Student{% endif %}</h2>
    
    <form method="POST">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;">
            <div>
                <label>Full Name *</label>
                <input type="text" name="name" value="{{ student.name if student else '' }}" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Roll Number</label>
                <input type="text" name="roll_no" value="{{ student.roll_no if student else '' }}" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Class *</label>
                <input type="text" name="class_name" value="{{ student.class_name if student else '' }}" required placeholder="e.g. 5" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Section</label>
                <input type="text" name="section" value="{{ student.section if student else '' }}" placeholder="e.g. A" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Gender</label>
                <select name="gender" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
                    <option value="">Select</option>
                    <option value="Male" {% if student and student.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student and student.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>
            <div>
                <label>Date of Birth</label>
                <input type="date" name="dob" value="{{ student.dob if student else '' }}" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Parent Name</label>
                <input type="text" name="parent_name" value="{{ student.parent_name if student else '' }}" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Parent Phone</label>
                <input type="text" name="parent_phone" value="{{ student.parent_phone if student else '' }}" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            </div>
        </div>
        
        <div style="margin-bottom:20px;">
            <label>Address</label>
            <textarea name="address" rows="2" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">{{ student.address if student else '' }}</textarea>
        </div>

        <button type="submit" style="background:#10b981; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
            {% if student %}Update Student{% else %}Save Student{% endif %}
        </button>
        <a href="/students/" style="margin-left:10px; color:#666; text-decoration:none;">Cancel</a>
    </form>
</div>
{% endblock %}
