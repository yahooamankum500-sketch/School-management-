<!DOCTYPE html>
<html>
<head>
    <title>Parent Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f59e0b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #f59e0b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .error { color: red; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#1e293b;">👨‍👩‍👧 Parent Portal</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="error">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <input name="phone" placeholder="Registered Phone Number" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div style="text-align:center; margin-top:15px; font-size:13px;">
            New here? <a href="/parent/register" style="color:#f59e0b;">Create Account</a>
        </div>
    </div>
</body>
</html>
