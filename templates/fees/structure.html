{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px; margin:auto;">
    <h2>Fee Structure Setup</h2>
    <form method="POST" style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:20px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
            <input type="text" name="class_name" placeholder="Class (e.g. 5)" required style="padding:8px; border:1px solid #ccc; border-radius:5px;">
            <input type="text" name="fee_type" placeholder="Fee Type (e.g. Tuition)" required style="padding:8px; border:1px solid #ccc; border-radius:5px;">
            <input type="number" name="amount" placeholder="Amount (₹)" required style="padding:8px; border:1px solid #ccc; border-radius:5px;">
            <select name="frequency" style="padding:8px; border:1px solid #ccc; border-radius:5px;">
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
                <option value="one-time">One-time</option>
            </select>
        </div>
        <button type="submit" class="btn">+ Add Fee Item</button>
        <a href="/fees/" style="margin-left:10px; color:#666;">Back to Fees</a>
    </form>

    <h3>Existing Structure</h3>
    <table>
        <tr><th>Class</th><th>Fee Type</th><th>Amount</th><th>Frequency</th></tr>
        {% for s in structures %}
        <tr>
            <td>{{ s[1] }}</td>
            <td><strong>{{ s[2] }}</strong></td>
            <td>₹{{ "%.0f"|format(s[3]) }}</td>
            <td>{{ s[4] }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" style="text-align:center;">Koi fee structure set nahi hai.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
