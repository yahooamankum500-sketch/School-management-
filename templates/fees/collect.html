{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;">
    <h2>Collect Fee</h2>
    
    <form method="POST">
        <div style="margin-bottom:15px;">
            <label>Student *</label>
            <select name="student_id" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                <option value="">-- Select Student --</option>
                {% for s in students %}
                <option value="{{ s.id }}">{{ s.name }} (Class {{ s.class_name }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;">
            <div>
                <label>Fee Type *</label>
                <input type="text" name="fee_type" required placeholder="Tuition" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Amount (₹) *</label>
                <input type="number" name="amount" required placeholder="1500" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Month</label>
                <input type="month" name="month" value="{{ current_month }}" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Payment Mode</label>
                <select name="mode" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                    <option value="cash">Cash</option>
                    <option value="upi">UPI</option>
                    <option value="cheque">Cheque</option>
                </select>
            </div>
        </div>

        <button type="submit" style="background:#10b981; color:white; padding:12px; width:100%; border:none; border-radius:5px; cursor:pointer; font-weight:bold; font-size:16px;">Record Payment</button>
        <div style="text-align:center; margin-top:10px;">
            <a href="/fees/" style="color:#666; text-decoration:none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
