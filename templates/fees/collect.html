{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:500px; margin:auto;">
    <h2>Collect Fee</h2>
    <form method="POST">
        <label>Student *</label>
        <select name="student_id" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;">
            <option value="">-- Select Student --</option>
            {% for s in students %}
            <option value="{{ s[0] }}">{{ s[1] }} ({{ s[3] or 'No Class' }})</option>
            {% endfor %}
        </select>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;">
            <div>
                <label>Fee Type *</label>
                <input type="text" name="fee_type" required placeholder="Tuition" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Amount (₹) *</label>
                <input type="number" name="amount" required placeholder="1500" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Month</label>
                <input type="month" name="month" value="{{ current_month }}" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div>
                <label>Payment Mode</label>
                <select name="mode" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                    <option value="cash">Cash</option>
                    <option value="upi">UPI</option>
                    <option value="cheque">Cheque</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn" style="width:100%; background:#10b981;">Record Payment</button>
        <div style="text-align:center; margin-top:10px;">
            <a href="/fees/" style="color:#666;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
