{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2>Staff Directory</h2>
        <a href="/staff/salary" style="background:#10b981; color:white; padding:8px 15px; text-decoration:none; border-radius:5px;">💰 Manage Salaries</a>
    </div>
    
    <!-- Add Staff Form -->
    <form method="POST" action="/staff/add" style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" name="name" placeholder="Full Name" required style="flex:1; min-width:150px; padding:8px; border:1px solid #ccc; border-radius:5px;">
        <input type="text" name="role" placeholder="Role (e.g. Teacher, Driver)" required style="flex:1; min-width:150px; padding:8px; border:1px solid #ccc; border-radius:5px;">
        <input type="text" name="phone" placeholder="Phone Number" style="flex:1; min-width:120px; padding:8px; border:1px solid #ccc; border-radius:5px;">
        <input type="number" name="salary" placeholder="Monthly Salary (₹)" required style="flex:1; min-width:120px; padding:8px; border:1px solid #ccc; border-radius:5px;">
        <button type="submit" style="background:#3b82f6; color:white; padding:8px 15px; border:none; border-radius:5px; cursor:pointer;">+ Add Staff</button>
    </form>

    <!-- Staff List -->
    <table style="width:100%; border-collapse:collapse;">
        <tr style="background:#f8fafc;">
            <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Name</th>
            <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Role</th>
            <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Phone</th>
            <th style="padding:10px; text-align:right; border-bottom:1px solid #ddd;">Salary</th>
        </tr>
        {% for s in staff %}
        <tr>
            <td style="padding:10px; border-bottom:1px solid #eee;"><strong>{{ s.name }}</strong></td>
            <td style="padding:10px; border-bottom:1px solid #eee;">{{ s.role }}</td>
            <td style="padding:10px; border-bottom:1px solid #eee;">{{ s.phone or '-' }}</td>
            <td style="padding:10px; border-bottom:1px solid #eee; text-align:right;">₹{{ "%.0f"|format(s.salary) }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" style="padding:20px; text-align:center; color:#666;">Koi staff member nahi hai.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
