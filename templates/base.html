<!DOCTYPE html>
<html>
<head>
    <title>School ERP</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; }
        .sidebar { width: 200px; background: #1e293b; color: white; height: 100vh; padding: 20px; }
        .sidebar a { color: #cbd5e1; display: block; padding: 10px 0; text-decoration: none; }
        .main { flex: 1; padding: 20px; background: #f5f6fa; }
        .flash { padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .flash.error { background: #fee2e2; color: #991b1b; }
        .flash.success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🎓 School ERP</h2>
        <a href="/dashboard">Dashboard</a>
        <a href="/students/">Students</a>
        <a href="/fees/">Fees</a>
        <a href="/attendance/">Attendance</a>
        <a href="/exams/">Exams & Marks</a>
        <a href="/notices/">Notices & Events</a>
        <a href="/library/">Library</a>
        <a href="/logout" style="color:#ef4444; margin-top:50px;">Logout</a>
    </div>
    <div class="main">
        <h3>Welcome, {{ session.admin_name }}</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
