{% extends "base.html" %}
{% block content %}
<div style="background:white; padding:20px; border-radius:8px; max-width:700px; margin:auto;">
    <h2>Marks Entry: {{ exam.name }} (Class {{ exam.class_name }})</h2>
    <p style="color:#666; margin-bottom:15px;">Max Marks: <strong>{{ exam.max_marks }}</strong></p>
    
    <form method="POST">
        <table style="width:100%; border-collapse:collapse;">
            <tr style="background:#f8fafc;">
                <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Roll No</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Student Name</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #ddd;">Marks Obtained</th>
            </tr>
            {% for s in students %}
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eee;">{{ s.roll_no or '-' }}</td>
                <td style="padding:10px; border-bottom:1px solid #eee;"><strong>{{ s.name }}</strong></td>
                <td style="padding:10px; border-bottom:1px solid #eee;">
                    <input type="number" step="0.01" name="mark_{{ s.id }}" max="{{ exam.max_marks }}" 
                           value="{{ marks_map.get(s.id|string, '') }}" 
                           placeholder="0" 
                           style="width:100px; padding:8px; border:1px solid #ccc; border-radius:5px;">
                </td>
            </tr>
            {% endfor %}
        </table>
        
        <div style="margin-top:20px;">
            <button type="submit" style="background:#10b981; color:white; padding:12px; width:100%; border:none; border-radius:5px; cursor:pointer; font-weight:bold; font-size:16px;">
                Save Marks
            </button>
        </div>
    </form>
    <div style="text-align:center; margin-top:15px;">
        <a href="/exams/" style="color:#666; text-decoration:none;">← Back to Exams</a>
    </div>
</div>
{% endblock %}
